<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ask Scaleflow a Question</title>
<style>
  :root{
    --bg:#f5f0df;
    --ink:#171717;
    --panel:#fffaf0;
    --accent:#6b59d3;
    --accent2:#ffcc4d;
    --shadow:#171717;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:
      linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px),
      linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px), var(--bg);
    background-size:16px 16px;
    color:var(--ink);
    font-family:"Courier New",monospace;
    image-rendering:pixelated;
  }
  .wrap{width:min(880px,92vw); text-align:center}
  .badge{
    display:inline-block; padding:7px 11px; margin-bottom:18px;
    border:3px solid var(--ink); background:var(--accent2);
    box-shadow:4px 4px 0 var(--shadow); font-weight:900; font-size:12px;
  }
  h1{
    margin:0 0 28px; text-transform:uppercase; letter-spacing:2px;
    font-size:clamp(27px,5vw,54px); line-height:1.05;
    text-shadow:4px 4px 0 #d9d0b8;
  }
  .assistant{
    display:flex; justify-content:center; align-items:center; gap:18px;
    margin:0 auto 28px; max-width:650px;
  }
  .face{
    width:96px; height:96px; flex:0 0 96px; position:relative;
    border:5px solid var(--ink); background:var(--accent2);
    box-shadow:7px 7px 0 var(--shadow);
  }
  .eye{position:absolute; top:27px; width:12px; height:12px; background:var(--ink)}
  .eye.l{left:20px}.eye.r{right:20px}
  .mouth{
    position:absolute; left:25px; bottom:21px; width:38px; height:12px;
    border-left:8px solid var(--ink); border-bottom:8px solid var(--ink); border-right:8px solid var(--ink);
  }
  .bubble{
    text-align:left; background:var(--panel); border:4px solid var(--ink);
    padding:16px 18px; box-shadow:6px 6px 0 var(--shadow);
    font-weight:bold; line-height:1.45;
  }
  .box{
    background:var(--panel); border:4px solid var(--ink);
    padding:22px; box-shadow:9px 9px 0 var(--shadow);
  }
  .hint{font-size:13px; margin:0 0 12px; opacity:.72}
  .row{display:flex; gap:10px}
  input{
    min-width:0; flex:1; border:4px solid var(--ink); padding:15px;
    font:700 16px "Courier New",monospace; background:white; outline:none;
  }
  input:focus{box-shadow:inset 0 0 0 3px #d8d0ff}
  button{
    border:4px solid var(--ink); padding:13px 20px; background:var(--accent);
    color:white; font:900 15px "Courier New",monospace; cursor:pointer;
    box-shadow:4px 4px 0 var(--shadow); text-transform:uppercase;
  }
  button:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
  button:active{transform:translate(4px,4px);box-shadow:none}
  #answer{
    display:none; margin-top:22px; padding:19px; border:4px dashed var(--ink);
    background:#e8e2ff; text-align:left; font-weight:900; line-height:1.5;
  }
  #answer.show{display:block; animation:pop .18s steps(2,end)}
  .label{font-size:11px; opacity:.6; margin-bottom:8px}
  .cursor{display:inline-block;width:10px;height:17px;background:var(--ink);vertical-align:-3px;animation:blink .8s steps(1) infinite}
  footer{margin-top:23px;font-size:11px;opacity:.55}
  @keyframes blink{50%{opacity:0}}
  @keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
  @media(max-width:600px){
    .assistant{align-items:flex-start}.face{width:76px;height:76px;flex-basis:76px}
    .eye{top:20px}.eye.l{left:14px}.eye.r{right:14px}.mouth{left:18px;bottom:15px}
    .row{flex-direction:column} button{width:100%}
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="badge">SCALEFLOW // MANAGEMENT AI v1.0</div>
  <h1>Ask Scaleflow a question</h1>

  <section class="assistant">
    <div class="face" aria-label="Pixelated smiling face">
      <span class="eye l"></span><span class="eye r"></span><span class="mouth"></span>
    </div>
    <div class="bubble">If you have any questions, just ask me!<span class="cursor"></span></div>
  </section>

  <section class="box">
    <p class="hint">Ask anything about your initiative. A blocker. An uncertainty.</p>
    <div class="row">
      <input id="question" autocomplete="off" placeholder="e.g. What should we measure?" />
      <button id="ask">ASK →</button>
    </div>
    <div id="answer" aria-live="polite">
      <div class="label">SCALEFLOW MANAGEMENT RESPONSE:</div>
      <div id="answerText"></div>
    </div>
  </section>
  <footer>Powered by alignment, metrics & strategic uncertainty.</footer>
</main>

<script>
const responses = [
  'Are we sure the problem is actually the problem? Sometimes what looks like a problem is simply a solution that hasn’t been positioned correctly yet. I think we need to understand the problem behind the problem before we start solving the visible one. For the next board meeting, please prepare three metrics showing how problematic the problem actually is.',

  'Do we know what percentage of this is measurable? If we can’t measure something, it becomes very difficult to demonstrate that we are successfully improving it. At the same time, measuring everything would probably distract us from the things we should actually be measuring. For the next board meeting, please prepare a metric showing the percentage of things we currently measure correctly.',

  'Who has ownership of the ownership here? I understand somebody owns the topic, but it’s not clear who is responsible for ensuring that the ownership itself remains properly owned. Without ownership governance, accountability can become surprisingly unaccountable. For the next board meeting, please prepare an ownership matrix including an owner for the ownership matrix.',

  'Have we considered whether moving forward is still the right direction? Progress is important, but movement should not automatically be confused with strategic progress. Sometimes moving sideways creates the organizational space required to eventually move forward with greater confidence. For the next board meeting, please prepare a directional progress dashboard with forward, sideways, and strategically stationary movement.',

  'Could we turn this into an initiative? Right now it sounds like a problem, which makes it unnecessarily operational. Once we make it an initiative, we can give it ownership, milestones, KPIs, and a steering committee without necessarily changing the underlying situation. For the next board meeting, please prepare an initiative proposal explaining how we plan to manage the problem strategically.',

  'Do we have enough numbers to understand why we need more numbers? The current data gives us some answers, but those answers are creating questions that the current data was never designed to answer. That suggests we may have reached the natural limit of the numbers we already have. For the next board meeting, please prepare additional numbers showing which additional numbers we still need.',

  'Can we get this as a percentage? The absolute number is useful, but percentages create context and generally look more intentional on a management slide. We don’t necessarily need to agree on the denominator immediately as long as we remain transparent about the direction. For the next board meeting, please convert this into at least three percentages with trend arrows.',

  'What would success look like if we were already successful? I think we are spending too much time looking at where we are instead of strategically imagining where the metrics should eventually say we are. Once we understand the future state, we can work backward until the current situation appears to be part of the plan. For the next board meeting, please prepare a success framework with three measurable outcomes.',

  'Have we asked Claude about this? I’m not suggesting we let AI make the decision, but it would be useful to know whether Claude independently reaches the conclusion we are hoping to reach. If it doesn’t, that could indicate either an interesting perspective or insufficient prompting. For the next board meeting, please prepare our recommendation, Claude’s recommendation, and the prompt required to align the two.',

  'Can we establish a baseline before we discuss the baseline? Without a baseline, improvement is difficult to measure, but choosing the wrong baseline could make future improvement misleadingly measurable. I think we first need to understand what a good baseline would look like before establishing the actual baseline. For the next board meeting, please prepare a baseline for the baseline-selection process.',

  'Is this really a blocker, or is it more of a strategically stationary opportunity? Calling something a blocker immediately creates a negative perception, while the same situation could potentially be viewed as additional time for alignment. Language matters because organizational momentum is partly determined by how we describe the absence of momentum. For the next board meeting, please reclassify all blockers into strategically appropriate categories.',

  'Do we know how many people are aligned? Saying that we are aligned is useful, but alignment without measurement remains largely anecdotal. We should probably distinguish between fully aligned, partially aligned, technically aligned, and people who nodded during the meeting. For the next board meeting, please prepare an alignment percentage by stakeholder.',

  'Could we solve this by adding another layer of governance? I understand the current process already has several approvals, but the fact that the problem still exists may indicate that the approvals themselves are insufficiently governed. An additional governance layer could provide oversight without interfering directly with the underlying work. For the next board meeting, please prepare a lightweight governance framework with no more than four new approval steps.',

  'Are we looking at this strategically enough? The current discussion seems focused on what actually needs to happen, which may be preventing us from seeing the broader organizational context. Execution is important, but premature execution can reduce the amount of time available for strategic discussion. For the next board meeting, please prepare a strategy explaining how we intend to eventually move toward execution.',

  'Can we create a dashboard for this? I know the information currently fits into one sentence, but a dashboard would allow us to understand how that sentence changes over time. It would also create a shared source of truth instead of repeatedly asking the person who already knows the answer. For the next board meeting, please prepare a dashboard with at least six KPIs and one unexplained pie chart.',

  'Do we know why the number changed? It may have increased because something improved, or because something else decreased relative to it, or because the definition changed while nobody was looking. Until we understand the story behind the number, the number itself is simply behaving numerically. For the next board meeting, please prepare a root-cause analysis for every number that moved.',

  'Could we schedule a workshop to understand whether we need a workshop? I don’t want to create unnecessary meetings, so it’s important that we validate the need collaboratively before putting something larger in the calendar. A short ninety-minute discovery session should give us enough information to decide. For the next board meeting, please prepare the workshop outcomes even if the workshop concludes that no workshop was needed.',

  'Are we overcomplicating this, or have we simply not complicated it enough to understand it? Simple problems can sometimes hide complexity that only becomes visible after introducing the correct framework. I would rather spend additional time understanding the complexity than accidentally solve something too simply. For the next board meeting, please prepare a complexity assessment with low, medium, high, and strategically unclear categories.',

  'Can we define a KPI for how well our KPIs are performing? Individual KPIs tell us whether specific things are moving, but they don’t tell us whether the KPI framework itself is moving in the right direction. We need some way to distinguish high-performing metrics from metrics that merely report high performance. For the next board meeting, please prepare a KPI Performance KPI with a clear owner.',

  'Do we have a single source of truth? I know we currently have the same information in five different places, but each place seems to be authoritative depending on who is presenting it. Rather than removing sources, perhaps we should clarify which truth each source is responsible for. For the next board meeting, please prepare a source-of-truth matrix showing ownership of each version of the truth.',

  'Could this be a communication problem rather than an actual problem? If everyone understood the situation differently but behaved correctly, then the operational outcome might still be acceptable despite the organizational confusion. On the other hand, consistent confusion could itself become a measurable communication outcome. For the next board meeting, please prepare a communication effectiveness metric based on how differently everyone understands the same thing.',

  'Are we sufficiently data-driven when deciding how data-driven we should be? We often say decisions should be based on data, but we haven’t measured how frequently our decisions are actually influenced by the data we collect. That means our data-driven strategy may currently be based largely on intuition. For the next board meeting, please prepare a percentage showing how data-driven our data-driven decisions are.',

  'Can we quantify the qualitative feeling that the quantitative numbers feel wrong? I appreciate that this is subjective, but subjectivity becomes easier to manage once we put a number next to it. We could potentially create a confidence percentage representing how comfortable stakeholders feel about the other percentages. For the next board meeting, please prepare this number with one decimal place so it looks sufficiently precise.',

  'What happens if we do nothing? Doing nothing is often presented as the absence of a decision, but strategically it is still a decision with outcomes, ownership, and potentially measurable consequences. We should therefore evaluate inaction with the same rigor as action. For the next board meeting, please prepare a business case for doing nothing, including milestones and an owner.',

  'Can we take a helicopter view of this? We’ve spent a lot of time discussing the actual details, which may be preventing us from seeing the larger picture that contains those details. I think we need to zoom out until the original problem becomes small enough to feel manageable. For the next board meeting, please prepare a high-level overview with enough detail to answer every low-level question.',

  'Do we have the right stakeholders in the room? The current group seems capable of making a decision, which makes me concerned that we may be missing perspectives from people who are less directly involved. Broader participation could reveal dependencies that currently aren’t preventing us from progressing. For the next board meeting, please identify at least five additional stakeholders and document why they should be consulted.',

  'Could we improve transparency by introducing another reporting layer? Right now information moves directly between the people who need it, which is efficient but difficult to govern centrally. An intermediate reporting structure could help us understand how information is being communicated before it reaches its destination. For the next board meeting, please prepare a communication flow showing at least three levels of escalation.',

  'Are our priorities prioritized enough? Everything currently marked as high priority appears to be competing with several other things also marked as high priority. That suggests the issue may not be the priorities themselves but the prioritization framework behind the priorities. For the next board meeting, please prepare a prioritized list of the priorities we should prioritize first.',

  'Could we make this more agile by adding a process around it? Agility requires flexibility, but flexibility without structure can become difficult to measure and govern. A lightweight process could ensure that everyone remains consistently flexible in approximately the same way. For the next board meeting, please prepare an agile governance process with mandatory checkpoints.',

  'Do we know whether the target is still the right target? Reaching a target is useful, but targets are created using assumptions that may no longer reflect the strategic reality in which we are trying to reach them. If performance is below target, it may therefore be worth reviewing the target before reviewing the performance. For the next board meeting, please prepare three alternative targets and explain which one makes the current results look most representative.',

  'Can we identify the quick wins first? Quick wins are important because they create momentum while larger strategic topics remain under discussion. However, we should avoid implementing them too quickly before validating whether they are genuinely quick and whether winning them creates measurable value. For the next board meeting, please prepare a six-week discovery plan to identify the top three quick wins.',

  'Are we sure we need a solution already? Moving directly from a problem to a solution risks skipping several valuable stages of discovery, alignment, ideation, validation, and stakeholder engagement. A good solution should ideally emerge after everyone has had enough time to become uncertain about the original problem. For the next board meeting, please prepare a roadmap showing when we expect to become ready to discuss possible solutions.',

  'Can we measure the progress of measuring progress? We currently report progress based on completed work, but that doesn’t capture improvements in our ability to understand whether work is progressing. Better measurement itself represents organizational maturity even when the underlying delivery remains unchanged. For the next board meeting, please prepare a progress-measurement maturity score and its quarterly trend.',

  'Do we understand the story behind the story behind the numbers? Dashboards tell us what happened, and explanations tell us why it happened, but neither necessarily tells us why the explanation matters strategically. I think we need another layer connecting the narrative to the organizational context. For the next board meeting, please prepare a slide explaining what the numbers mean, what that meaning means, and what we should conclude from the meaning.',

  'Could we benchmark this against someone completely different from us? Internal comparisons only tell us how we perform relative to ourselves, which limits the amount of external context we can introduce into the discussion. Comparing ourselves with organizations solving unrelated problems could reveal practices we would otherwise never consider. For the next board meeting, please prepare three industry benchmarks regardless of whether the industries are relevant.',

  'Who is accountable for the dependency that nobody owns? Dependencies naturally sit between areas of ownership, which is exactly why they can remain unowned while everyone involved technically owns their own part. We need somebody accountable for ensuring that everybody else remains accountable for their respective dependency responsibilities. For the next board meeting, please assign an owner to every dependency and a backup owner to the ownership.',

  'Could we simplify this by making it configurable? Configuration gives us flexibility to handle scenarios that don’t currently exist without changing the underlying implementation later. It may introduce some complexity now, but that complexity could protect us from hypothetical future simplicity problems. For the next board meeting, please prepare a configuration framework covering at least ten potential future scenarios.',

  'Are we moving fast enough to justify how slowly we’re deciding? Good decisions take time, but spending more time deciding can also reduce the amount of time available for execution. This means decision speed and execution speed should probably be evaluated together as one broader measure of organizational velocity. For the next board meeting, please prepare a decision-to-execution velocity KPI.',

  'Can we create an OKR around understanding this better? Right now we have a question, but questions don’t naturally appear in strategic reporting unless they are connected to measurable outcomes. Turning the uncertainty into an Objective would give us a formal structure for learning what we don’t currently know. For the next board meeting, please prepare one Objective and at least four Key Results for reducing uncertainty.',

  'Have we challenged our assumptions about challenging our assumptions? We regularly say that assumptions should be challenged, but that itself has become an assumption we rarely challenge. There may be situations where retaining an assumption creates more strategic consistency than continuously questioning it. For the next board meeting, please prepare an assumption register including which assumptions we should assume without further challenge.',

  'Could we use AI here somehow? I’m not saying AI is necessarily the solution, but it would be strategically unfortunate to solve the problem before understanding whether AI could have solved it instead. Even a small AI component could provide useful learning and create an additional innovation metric. For the next board meeting, please prepare an AI proof of concept and ask Claude whether the proof of concept needs AI.',

  'Do we know how scalable this is? I understand the current volume is small, but architecture should ideally be prepared for a future where everything becomes dramatically more successful than our forecasts suggest. We shouldn’t overengineer it, but we also shouldn’t allow reality to constrain our scalability ambitions. For the next board meeting, please prepare scenarios for current volume, ten-times volume, and one-million-times volume.',

  'Can we make ownership more visible? People may already know who owns what, but knowledge that isn’t represented in a slide is difficult to govern consistently. Visual ownership could create clarity while also making it easier to identify areas where too many arrows point toward the same person. For the next board meeting, please prepare an ownership heatmap with names, percentages, arrows, and at least one red area.',

  'Are we learning enough from the lessons learned? We regularly identify lessons, but identifying a lesson doesn’t necessarily mean that the organization has successfully learned it. If the same lesson appears repeatedly, that could either indicate failure to learn or confirmation that it is a particularly valuable lesson. For the next board meeting, please prepare a Lessons Learned Learning Rate showing how many lessons have actually been learned.',

  'Can we reduce the number of meetings by scheduling a meeting about it? Meeting efficiency is an organizational issue that requires cross-functional alignment and therefore probably shouldn’t be decided asynchronously. A focused workshop could help us understand which meetings can be removed and which additional meetings are required to manage the reduction. For the next board meeting, please prepare a meeting-reduction initiative with a weekly steering meeting.',

  'Do we have enough beta users to validate whether we need beta users? Beta programs create useful feedback, but the feedback is only meaningful if the beta population represents the population we hope will eventually stop being beta. We may therefore need a pre-beta group to validate the composition of the actual beta group. For the next board meeting, please prepare a beta-readiness metric and a proposal for selecting beta users for the beta-user selection process.',

  'Could the lack of progress actually indicate progress at a different level? Visible delivery is only one dimension of progress; alignment, discovery, learning, governance, and stakeholder engagement can all move forward while the output remains unchanged. We should be careful not to interpret the absence of delivery as the absence of organizational movement. For the next board meeting, please prepare a metric showing invisible progress as a percentage.',

  'Can we make the process simpler by documenting it in more detail? People often experience complexity because they don’t understand why all the individual steps are necessary. Adding comprehensive documentation could make a complicated process feel simpler without requiring us to remove any of the complexity itself. For the next board meeting, please prepare a simplified process document of no more than 60 pages.',

  'Are we confident enough in our confidence level? Saying we are confident is useful, but confidence without a measurable scale makes it difficult to compare confidence across initiatives. We should distinguish between technical confidence, business confidence, stakeholder confidence, and confidence that those confidence measures are reliable. For the next board meeting, please prepare a weighted confidence index with a confidence interval.',

  'Could the real issue be that we’re focusing too much on the real issue? Directly addressing the obvious problem may prevent us from discovering adjacent strategic opportunities that would never appear if the problem were simply solved. Sometimes unresolved problems create valuable organizational conversations that solutions prematurely eliminate. For the next board meeting, please prepare three opportunities created by not solving this yet.',

  'Are we ready to start preparing to move forward? I think we’ve completed most of the initial alignment required to begin discussing what preparation for execution might look like. We shouldn’t rush into preparation before the preparation criteria themselves have been properly validated. For the next board meeting, please prepare a readiness assessment showing how close we are to being ready to prepare.',

  'Can we take this offline and circle back? We’ve reached the point where continuing the discussion might accidentally produce a decision, and I’m not sure all stakeholders have had enough time to develop additional concerns. An offline discussion would allow us to align before returning with a more structured version of the same uncertainty. For the next board meeting, please prepare a summary of the offline alignment, open questions, ownership, KPIs, next steps, and whether another meeting is required.'
];

let last = -1;
function answer(){
  const q = document.getElementById("question");
  if(!q.value.trim()){
    q.focus();
    q.placeholder = "You need to ask something first...";
    return;
  }
  let i;
  do { i = Math.floor(Math.random() * responses.length); } while(i === last && responses.length > 1);
  last = i;
  document.getElementById("answerText").textContent = responses[i];
  const a = document.getElementById("answer");
  a.classList.remove("show");
  void a.offsetWidth;
  a.classList.add("show");
}
document.getElementById("ask").addEventListener("click", answer);
document.getElementById("question").addEventListener("keydown", e => {
  if(e.key === "Enter") answer();
});
</script>
</body>
</html>
